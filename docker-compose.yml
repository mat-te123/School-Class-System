name: school-class-system

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_class_system_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_NAME=:8080
    volumes:
      - .:/var/www/html
      - ./Caddyfile:/etc/caddy/Caddyfile
    tty: true
