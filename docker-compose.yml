name: school-class-system

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_class_system_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_NAME=:8080
    volumes:
      - .:/var/www/html
      - ./Caddyfile:/etc/caddy/Caddyfile
    tty: true

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_class_system_queue
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      - app

